<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#681924" />
    <title>دیالوگ آفلاین است</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fff8ea;
        --warm: #f6efe3;
        --ink: #191512;
        --muted: #74685b;
        --primary: #681924;
        --accent: #d49a2a;
        --border: #e5d6bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 0, rgb(212 154 42 / 22%), transparent 28rem),
          linear-gradient(180deg, #fff6e7, var(--warm));
        color: var(--ink);
        font-family: Vazirmatn, Tahoma, Arial, sans-serif;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: rgb(255 248 234 / 88%);
        padding: 32px;
        box-shadow: 0 24px 70px rgb(49 25 13 / 12%);
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 999px;
        display: block;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 7vw, 2.7rem);
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.9;
      }

      .en {
        direction: ltr;
        text-align: left;
        margin-top: 12px;
        font-family: Manrope, Inter, Arial, sans-serif;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fffaf0;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 30px rgb(104 25 36 / 18%);
      }

      button:focus-visible {
        outline: 3px solid rgb(212 154 42 / 75%);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/dialog-logo-circle.png" alt="" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>دیالوگ الان به اینترنت دسترسی ندارد. اتصال را بررسی کنید و دوباره تلاش کنید.</p>
      <p class="en">Dialog is offline. Please check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">تلاش مجدد</button>
    </main>
  </body>
</html>
